<!DOCTYPE html>
<html>
<head>
  <title>Employee App</title>

  <style>
    body {
      font-family: Arial;
      background:#f4f4f4;
      padding:20px;
    }

    .container {
      max-width:700px;
      margin:auto;
      background:#fff;
      padding:20px;
    }

    h2 {
      text-align:center;
    }

    .search-box {
      display:flex;
      gap:10px;
      margin-bottom:10px;
    }

    .search-box input {
      flex:1;
      padding:10px;
    }

    .search-box button {
      width:120px;
      background:#333;
      color:#fff;
      border:none;
      cursor:pointer;
    }

    input, button {
      width:100%;
      padding:10px;
      margin:5px 0;
    }

    button {
      background:green;
      color:white;
      border:none;
      cursor:pointer;
    }

    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th, td {
      border:1px solid #ddd;
      text-align:center;
      padding:8px;
    }

    th {
      background:#007bff;
      color:white;
    }

    .delete {
      background:red;
      color:white;
      padding:5px;
      border:none;
      cursor:pointer;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>Employee Management System</h2>

  <!-- SEARCH -->
  <div class="search-box">
    <input id="search" placeholder="Search ID / Name / Role">
    <button onclick="searchEmployee()">Search</button>
    <button onclick="resetSearch()">Reset</button>
  </div>

  <!-- ADD FORM -->
  <input id="name" placeholder="Name">
  <input id="role" placeholder="Role">
  <input id="email" placeholder="Email">
  <input id="phone" placeholder="Phone">
  <input id="dob" type="date">

  <button onclick="addEmployee()">Add Employee</button>

  <!-- TABLE -->
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Role</th>
        <th>Email</th>
        <th>Phone</th>
        <th>DOB</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="table"></tbody>
  </table>

</div>

<script>

const API = "/employees";

/* LOAD */
async function load() {
  try {
    const res = await fetch(API);
    const data = await res.json();
    render(data);
  } catch (err) {
    console.error("Load error:", err);
  }
}

/* RENDER */
function render(data) {
  const table = document.getElementById("table");

  if (!data || data.length === 0) {
    table.innerHTML = `
      <tr>
        <td colspan="7" style="color:red;font-weight:bold;padding:15px;">
          Result Not Found
        </td>
      </tr>
    `;
    return;
  }

  table.innerHTML = data.map((e, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${e.name}</td>
      <td>${e.role}</td>
      <td>${e.email || "-"}</td>
      <td>${e.phone || "-"}</td>
      <td>${e.dob ? e.dob.split("T")[0] : "-"}</td>
      <td>
        <button class="delete" onclick="del(${e.id})">X</button>
      </td>
    </tr>
  `).join("");
}

/* SEARCH */
async function searchEmployee() {
  const key = document.getElementById("search").value;

  const res = await fetch(`${API}?search=${key}`);
  const data = await res.json();

  render(data);
}

/* RESET */
function resetSearch() {
  document.getElementById("search").value = "";
  load();
}

/* ADD (FINAL FIXED VERSION) */
async function addEmployee() {

  const payload = {
    name: document.getElementById("name").value.trim(),
    role: document.getElementById("role").value.trim(),
    email: document.getElementById("email").value.trim() || null,
    phone: document.getElementById("phone").value.trim() || null,
    dob: document.getElementById("dob").value || null
  };

  if (!payload.name || !payload.role) {
    alert("Name and Role are required!");
    return;
  }

  try {
    const res = await fetch(API, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    console.log("Server Response:", data);

    if (!res.ok) {
      alert(data.message || data.error || "Error adding employee");
      return;
    }

    load();

    document.getElementById("name").value = "";
    document.getElementById("role").value = "";
    document.getElementById("email").value = "";
    document.getElementById("phone").value = "";
    document.getElementById("dob").value = "";

  } catch (err) {
    console.error("POST ERROR:", err);
    alert("Backend not reachable or error occurred");
  }
}

/* DELETE */
async function del(id) {
  await fetch(`${API}/${id}`, { method: "DELETE" });
  load();
}

/* INIT */
load();

</script>

</body>
</html>
