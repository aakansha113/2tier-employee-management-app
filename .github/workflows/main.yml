name: CI/CD Pipeline

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: employee-management-app

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Image Tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker Image
        run: |
          echo "🔨 Building image..."
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG} ./backend

      - name: Push Docker Image
        run: |
          echo "📤 Pushing image..."
          docker push ${{ secrets.DOCKER_USERNAME }}/${IMAGE_NAME}:${IMAGE_TAG}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes (EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            set -e

            IMAGE="${{ secrets.DOCKER_USERNAME }}/employee-management-app:${GITHUB_SHA::7}"

            echo "🚀 Deploying image: $IMAGE"

            # -----------------------------
            # STEP 1: Clone / update repo
            # -----------------------------
            if [ ! -d "2tier-employee-management-app" ]; then
              git clone https://github.com/aakansha113/2tier-employee-management-app.git
            else
              cd 2tier-employee-management-app && git pull && cd ..
            fi

            # -----------------------------
            # STEP 2: Apply Kubernetes manifests
            # -----------------------------
            cd 2tier-employee-management-app/k8s
            kubectl apply -f .

            # -----------------------------
            # STEP 3: Update deployment image
            # -----------------------------
            kubectl set image deployment/employee-app employee-app=$IMAGE

            # -----------------------------
            # STEP 4: Force fresh image pull
            # -----------------------------
            kubectl patch deployment employee-app -p \
              '{"spec":{"template":{"spec":{"containers":[{"name":"employee-app","imagePullPolicy":"Always"}]}}}}'

            # -----------------------------
            # STEP 5: Wait for rollout
            # -----------------------------
            kubectl rollout status deployment/employee-app --timeout=180s

            # -----------------------------
            # STEP 6: Verify deployment
            # -----------------------------
            kubectl get pods -o wide
            kubectl get svc

            echo "✅ Deployment successful"
