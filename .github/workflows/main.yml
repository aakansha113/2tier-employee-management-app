name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          echo "🔨 Building image with tag: ${{ github.run_number }}"
          docker build -t ${{ secrets.DOCKER_USERNAME }}/employee-management-app:${{ github.run_number }} ./backend

      - name: Push Docker Image
        run: |
          echo "📤 Pushing image..."
          docker push ${{ secrets.DOCKER_USERNAME }}/employee-management-app:${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Kubernetes (EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |

            set -e

            IMAGE=${{ secrets.DOCKER_USERNAME }}/employee-management-app:${{ github.run_number }}

            echo "🚀 Deploying image: $IMAGE"

            # Check kubectl is working
            kubectl get nodes

            # Update deployment
            kubectl set image deployment/employee-app \
            employee-app=$IMAGE

            # Wait for rollout
            kubectl rollout status deployment/employee-app --timeout=120s

            # Verify pods
            kubectl get pods

            echo "✅ Deployment successful"
